name: Sync ML (remover inativos)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rodar sync
        run: python sync_ml.py

      - name: Commit e push (se mudou)
        run: |
          cd /home/runner/work/meu-site-ofertas/meu-site-ofertas
          git config user.name "rpgdog-create"
          git config user.email "rpgdog@gmail.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add manual.json
            git commit -m "sync: remover produtos ML inativos ($(date +%Y-%m-%d))"
            git push origin main
          else
            echo "Nada a fazer."
          fi   
