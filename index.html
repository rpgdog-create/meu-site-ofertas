<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofertas do Dia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero">
    <h1>🔥 Ofertas do Dia</h1>
    <p class="subtitle">As melhores ofertas dos marketplaces</p>
  </div>

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="nav-links">
        <a href="index.html" id="nav-inicio" class="active">Início</a>
        <a href="#" id="nav-ml">ML</a>
        <a href="#" id="nav-amazon">Amazon</a>
        <a href="#" id="nav-shopee">Shopee</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
        <a href="admin.html" class="admin-link" title="Admin">⚙️</a>
        <button class="theme-toggle" id="theme-toggle" title="Alternar tema">🌙</button>
      </div>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <h3>Categorias</h3>
      <div id="chips"></div>
    </aside>

    <div class="main-content">
      <div class="filters-bar">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="🔍 Buscar produto, marca, modelo...">
        </div>
        <div class="filter-row">
          <label>Preço:</label>
          <input type="number" id="price-min" placeholder="Mín" min="0" step="0.01">
          <span style="color:var(--text-light);">—</span>
          <input type="number" id="price-max" placeholder="Máx" min="0" step="0.01">
          <label class="checkbox-wrap">
            <input type="checkbox" id="frete-gratis"> Frete grátis
          </label>
          <select id="sort-select">
            <option value="recentes">Mais recentes</option>
            <option value="menor-preco">Menor preço</option>
            <option value="maior-preco">Maior preço</option>
          </select>
        </div>
      </div>

      <div class="results-bar">
        <span class="count" id="results-count"></span>
      </div>

      <div id="grid-all" class="grid"></div>
    </div>
  </div>

  <button id="btn-top" title="Voltar ao topo">↑</button>

  <footer>
    <p class="footer-logo">🔥 Ofertas do Dia</p>
    <p>Site de afiliados — comissões ajudam a manter o projeto.</p>
    <p style="margin-top:0.8rem;"><a href="admin.html">⚙️ Admin</a></p>
    <p style="margin-top:0.5rem;opacity:0.6;">© 2026</p>
  </footer>

  <script>
    // Dark mode
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      var btn = document.getElementById('theme-toggle');
      function updateIcon() {
        var t = document.documentElement.getAttribute('data-theme');
        btn.textContent = t === 'dark' ? '☀️' : '🌙';
      }
      updateIcon();
      btn.addEventListener('click', function() {
        var t = document.documentElement.getAttribute('data-theme');
        var next = t === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateIcon();
      });
    })();

    var grid = document.getElementById('grid-all');
    var searchInput = document.getElementById('search-input');
    var priceMin = document.getElementById('price-min');
    var priceMax = document.getElementById('price-max');
    var freteGratis = document.getElementById('frete-gratis');
    var sortSelect = document.getElementById('sort-select');
    var chipsContainer = document.getElementById('chips');
    var resultsCount = document.getElementById('results-count');
    var allOffers = [];
    var activeCat = 'all';
    var activeMp = '';
    var searchTerm = '';
    var minPrice = 0;
    var maxPrice = Infinity;
    var freteOnly = false;
    var sortBy = 'recentes';

    function getMpKey(p) {
      var mp = (p.marketplace || '').toUpperCase();
      if (mp === 'ML' || mp === 'MERCADO LIVRE') return 'ML';
      if (mp === 'SHOPEE') return 'SHOPEE';
      if (mp === 'AMAZON') return 'AMAZON';
      var link = (p.link || p.offerLink || '').toLowerCase();
      if (link.includes('mercadolivre') || link.includes('meli.la')) return 'ML';
      if (link.includes('shopee')) return 'SHOPEE';
      if (link.includes('amazon')) return 'AMAZON';
      return '';
    }

    function getBadge(p) {
      var mp = getMpKey(p);
      if (mp === 'ML') return '<span class="mp-badge mp-ml">🛒 ML</span>';
      if (mp === 'SHOPEE') return '<span class="mp-badge mp-shopee">🛍️ Shopee</span>';
      if (mp === 'AMAZON') return '<span class="mp-badge mp-amazon">📦 Amazon</span>';
      return '';
    }

    function renderCard(p) {
      var div = document.createElement('div');
      div.className = 'card';
      var badge = getBadge(p);
      var tag = p.tag ? '<span class="tag">' + p.tag + '</span>' : '';
      var img = p.imagem ? '<img src="' + p.imagem + '" alt="" class="card-img" loading="lazy">' : '';
      var frete = p.frete ? '<p class="frete">🚚 ' + p.frete + '</p>' : '';
      var desc = p.descricao ? '<p class="desc">' + p.descricao + '</p>' : '';
      var cat = p.categoria ? '<p class="meta">📂 ' + p.categoria + '</p>' : '';
      div.innerHTML =
        badge +
        tag +
        img +
        '<h3>' + (p.productName || p.nome) + '</h3>' +
        '<p class="price">R$ ' + Number(p.price || p.preco).toFixed(2) + '</p>' +
        '<p class="commission">' + (p.commissionRate ? 'Comissão: ' + p.commissionRate + '%' : '') + '</p>' +
        '<p class="meta">' + (p.rating ? '⭐ ' + p.rating : '') + ' ' + (p.salesCount ? '| ' + p.salesCount + ' vendidos' : '') + '</p>' +
        frete +
        cat +
        desc +
        '<a href="' + (p.offerLink || p.link) + '" target="_blank" rel="noopener">Ver oferta →</a>';
      return div;
    }

    function buildChips() {
      var cats = new Set();
      allOffers.forEach(function(p) {
        var c = p.categoria || p.categoriaAuto;
        if (c) cats.add(c);
      });
      var sorted = Array.from(cats).sort(function(a, b) { return a.localeCompare(b, 'pt-BR'); });
      chipsContainer.innerHTML = '<span class="chip active" data-cat="all">Todos (' + allOffers.length + ')</span>';
      sorted.forEach(function(cat) {
        var count = allOffers.filter(function(p) { return (p.categoria || p.categoriaAuto) === cat; }).length;
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.dataset.cat = cat;
        chip.textContent = cat + ' (' + count + ')';
        chip.addEventListener('click', function() {
          chipsContainer.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
          chip.classList.add('active');
          activeCat = cat;
          renderGrid();
        });
        chipsContainer.appendChild(chip);
      });
      chipsContainer.querySelector('[data-cat="all"]').addEventListener('click', function() {
        chipsContainer.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
        chipsContainer.querySelector('[data-cat="all"]').classList.add('active');
        activeCat = 'all';
        renderGrid();
      });
    }

    function renderGrid() {
      var filtered = allOffers.slice();

      if (activeMp) {
        filtered = filtered.filter(function(p) { return getMpKey(p) === activeMp; });
      }

      if (activeCat !== 'all') {
        filtered = filtered.filter(function(p) { return (p.categoria || p.categoriaAuto || '') === activeCat; });
      }

      if (searchTerm) {
        var term = searchTerm.toLowerCase();
        filtered = filtered.filter(function(p) {
          var nome = (p.productName || p.nome || '').toLowerCase();
          var desc = (p.descricao || '').toLowerCase();
          var cat = (p.categoria || '').toLowerCase();
          return nome.includes(term) || desc.includes(term) || cat.includes(term);
        });
      }

      if (minPrice > 0) {
        filtered = filtered.filter(function(p) { return Number(p.price || p.preco || 0) >= minPrice; });
      }
      if (maxPrice < Infinity) {
        filtered = filtered.filter(function(p) { return Number(p.price || p.preco || 0) <= maxPrice; });
      }

      if (freteOnly) {
        filtered = filtered.filter(function(p) { return /gr[aá]tis/i.test(p.frete || ''); });
      }

      if (sortBy === 'menor-preco') {
        filtered.sort(function(a, b) { return Number(a.price || a.preco || 0) - Number(b.price || b.preco || 0); });
      } else if (sortBy === 'maior-preco') {
        filtered.sort(function(a, b) { return Number(b.price || b.preco || 0) - Number(a.price || a.preco || 0); });
      }

      grid.innerHTML = '';
      if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;color:var(--text-light);">Nenhuma oferta encontrada com os filtros atuais.</p>';
      } else {
        filtered.forEach(function(p, i) {
          var card = renderCard(p);
          card.style.animationDelay = (i * 0.04) + 's';
          grid.appendChild(card);
        });
      }
      resultsCount.textContent = filtered.length + ' oferta(s)';
    }

    searchInput.addEventListener('input', function() { searchTerm = searchInput.value.trim(); renderGrid(); });
    priceMin.addEventListener('input', function() { minPrice = parseFloat(priceMin.value) || 0; renderGrid(); });
    priceMax.addEventListener('input', function() { maxPrice = parseFloat(priceMax.value) || Infinity; renderGrid(); });
    freteGratis.addEventListener('change', function() { freteOnly = freteGratis.checked; renderGrid(); });
    sortSelect.addEventListener('change', function() { sortBy = sortSelect.value; renderGrid(); });

    function setNavMp(mp, el) {
      var navLinks = document.querySelectorAll('.nav-links a');
      navLinks.forEach(function(a) { a.classList.remove('active'); });
      if (mp === '') {
        document.getElementById('nav-inicio').classList.add('active');
      } else {
        el.classList.add('active');
      }
      activeMp = mp;
      renderGrid();
    }

    document.getElementById('nav-inicio').addEventListener('click', function(e) { e.preventDefault(); setNavMp('', this); });
    document.getElementById('nav-ml').addEventListener('click', function(e) { e.preventDefault(); setNavMp('ML', this); });
    document.getElementById('nav-amazon').addEventListener('click', function(e) { e.preventDefault(); setNavMp('AMAZON', this); });
    document.getElementById('nav-shopee').addEventListener('click', function(e) { e.preventDefault(); setNavMp('SHOPEE', this); });

    async function loadAll() {
      try {
        var r1 = await fetch('manual.json?t=' + Date.now());
        var r2 = await fetch('ofertas.json?t=' + Date.now());
        var manual = await r1.json().catch(function() { return []; });
        var shopee = await r2.json().catch(function() { return []; });
        allOffers = manual.concat(shopee);
        buildChips();
        renderGrid();
      } catch (e) {
        grid.innerHTML = '<p style="grid-column:1/-1;color:var(--text-light);">Erro ao carregar ofertas.</p>';
      }
    }

    loadAll();

    // Botão flutuante "voltar ao topo" (arrastável)
    (function() {
      var btn = document.getElementById('btn-top');
      var dragging = false, offsetX = 0, offsetY = 0, moved = false;
      btn.addEventListener('mousedown', function(e) {
        dragging = true;
        moved = false;
        offsetX = e.clientX - btn.offsetLeft;
        offsetY = e.clientY - btn.offsetTop;
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        if (!moved) {
          moved = true;
          btn.style.right = 'auto';
          btn.style.bottom = 'auto';
        }
        btn.style.left = (e.clientX - offsetX) + 'px';
        btn.style.top = (e.clientY - offsetY) + 'px';
      });
      document.addEventListener('mouseup', function() { dragging = false; });
      btn.addEventListener('click', function() {
        if (!moved) window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    })();
  </script>
</body>
</html>
